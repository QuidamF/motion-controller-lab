[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-gateway"
version = "0.1.0"
description = "BLE GATT to WebSocket gateway for the Motion Controller Lab"
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.22",
    "websockets>=12",
]

[project.scripts]
motion-gateway = "motion_gateway.main:main"

[tool.setuptools.packages.find]
where = ["src"]
